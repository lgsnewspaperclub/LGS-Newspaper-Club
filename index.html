<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#a6a6a6">
    <meta name="description" content="LGS Newspaper Club — school news, student opinions, interviews and events.">

    <title>LGS Newspaper Club</title>

    <style>
        :root {
            --grey: #a6a6a6;
            --black: #000000;
            --line: rgba(0, 0, 0, 0.45);
            --muted: #333333;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: var(--grey);
            color: var(--black);
            font-family: Georgia, "Times New Roman", serif;
            line-height: 1.6;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        .topbar {
            padding: 10px 5%;
            border-bottom: 1px solid var(--black);
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            font: 11px Arial, sans-serif;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .masthead {
            text-align: center;
            padding: 35px 20px 25px;
        }

        .masthead .logo {
            max-width: 420px;
            width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            mix-blend-mode: multiply;
        }

        .masthead p {
            margin: 12px 0 0;
            font-size: 15px;
            font-style: italic;
        }

        .masthead .rule {
            width: 100%;
            max-width: 680px;
            height: 5px;
            border-top: 2px solid var(--black);
            border-bottom: 1px solid var(--black);
            margin: 20px auto 0;
        }

        nav {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px 32px;
            padding: 14px 16px;
            border-top: 1px solid var(--black);
            border-bottom: 2px solid var(--black);
        }

        nav a {
            font: bold 11px Arial, sans-serif;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        main {
            max-width: 1150px;
            margin: auto;
            padding: 30px 24px 60px;
        }

        .label {
            font: bold 10px Arial, sans-serif;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .intro {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 35px;
            padding-bottom: 35px;
            border-bottom: 3px double var(--black);
        }

        .intro h2 {
            font-size: clamp(34px, 5vw, 57px);
            line-height: 1.08;
            letter-spacing: -1px;
            margin: 12px 0;
        }

        .intro .description {
            max-width: 620px;
            font-size: 17px;
        }

        .intro-aside {
            border-left: 1px solid var(--black);
            padding-left: 26px;
        }

        .intro-aside h3 {
            font-size: 27px;
            line-height: 1.2;
            margin: 12px 0;
        }

        .section {
            padding: 32px 0;
            border-bottom: 1px solid var(--black);
            scroll-margin-top: 20px;
        }

        .section-title {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px 18px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--black);
            margin-bottom: 22px;
        }

        .section-title h2 {
            margin: 0;
            font-size: clamp(25px, 4vw, 34px);
            line-height: 1.2;
        }

        .section-title span {
            font: 10px Arial, sans-serif;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .article-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 24px;
        }

        .article {
            min-width: 0;
            padding-right: 20px;
            border-right: 1px solid var(--line);
        }

        .article:last-child {
            padding-right: 0;
            border-right: none;
        }

        .article h3 {
            font-size: 23px;
            line-height: 1.22;
            margin: 10px 0;
        }
